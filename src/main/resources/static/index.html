<!DOCTYPE html>
<html>

<head>
    <title>Distributed Cache Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-200 p-6 font-sans">

    <h1 class="text-4xl font-bold mb-6 text-blue-400">
        ⚡ Distributed Cache System
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- PUT CARD -->
        <div class="bg-gray-900 p-6 rounded-xl shadow-lg border border-gray-800">
            <h2 class="text-xl mb-4 text-green-400 font-semibold">PUT (Store Value)</h2>

            <input id="putKey" placeholder="Key" class="w-full p-2 mb-3 rounded bg-gray-800 border border-gray-700">

            <input id="putValue" placeholder="Value" class="w-full p-2 mb-3 rounded bg-gray-800 border border-gray-700">

            <button onclick="putData()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded w-full">
                Store
            </button>
        </div>

        <!-- GET CARD -->
        <div class="bg-gray-900 p-6 rounded-xl shadow-lg border border-gray-800">
            <h2 class="text-xl mb-4 text-blue-400 font-semibold">GET (Fetch Value)</h2>

            <input id="getKey" placeholder="Key" class="w-full p-2 mb-3 rounded bg-gray-800 border border-gray-700">

            <button onclick="getData()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded w-full">
                Fetch
            </button>

            <div id="getResult" class="mt-4 p-3 bg-gray-800 rounded text-sm"></div>
        </div>

        <!-- DELETE CARD -->
        <div class="bg-gray-900 p-6 rounded-xl shadow-lg border border-gray-800">
            <h2 class="text-xl mb-4 text-red-400 font-semibold">DELETE (Remove Key)</h2>

            <input id="deleteKey" placeholder="Key" class="w-full p-2 mb-3 rounded bg-gray-800 border border-gray-700">

            <button onclick="deleteData()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded w-full">
                Delete
            </button>

            <div id="deleteResult" class="mt-4 p-3 bg-gray-800 rounded text-sm"></div>
        </div>

        <!-- CLUSTER -->
        <div class="bg-gray-900 p-6 mt-6 rounded-xl border border-gray-800">
            <h2 class="text-xl text-purple-400 mb-3">Cluster Nodes</h2>

            <button onclick="getCluster()" class="bg-purple-500 hover:bg-purple-600 px-4 py-2 rounded">
                Load Cluster Info
            </button>

            <div id="cluster" class="mt-4 text-sm"></div>
        </div>
    </div>

    <!-- LOG PANEL -->
    <div class="bg-black mt-6 p-4 rounded-xl border border-gray-800">
        <h2 class="text-lg text-yellow-400 mb-2">Live Logs</h2>
        <div id="logs" class="text-xs max-h-48 overflow-y-auto"></div>
    </div>

    <script>

        function log(msg) {
            const logs = document.getElementById("logs");
            logs.innerHTML = `<div>• ${msg}</div>` + logs.innerHTML;
        }

        function renderStatus(status) {
            return status.includes("SUCCESS")
                ? `<span class="text-green-400">✔ ${status}</span>`
                : `<span class="text-red-400">✖ ${status}</span>`;
        }

        async function putData() {
            const key = document.getElementById("putKey").value;
            const value = document.getElementById("putValue").value;

            log(`PUT → ${key}`);

            const res = await fetch(`/cache?key=${key}&value=${value}`, {
                method: "POST"
            });

            const data = await res.json();

            log(`PUT Result → ${data.status}`);

            alert(JSON.stringify(data, null, 2));
        }

        async function getData() {
            const key = document.getElementById("getKey").value;

            log(`GET → ${key}`);

            const res = await fetch(`/cache/${key}`);
            const data = await res.json();

            const container = document.getElementById("getResult");

            if (res.status === 404) {
                container.innerHTML = `
            <div class="text-red-400">Key not found</div>
        `;
                log("GET → NOT FOUND");
                return;
            }

            container.innerHTML = `
        <div><strong>Key:</strong> ${data.key}</div>
        <div><strong>Value:</strong> ${data.value}</div>
        <div>${renderStatus(data.status)}</div>
    `;

            log(`GET Result → ${data.value}`);
        }

        async function deleteData() {
            const key = document.getElementById("deleteKey").value;

            if (!key) {
                alert("Enter a key");
                return;
            }
            if (!confirm(`Delete key "${key}"?`)) {
                return;
            }
            log(`DELETE → ${key}`);

            const res = await fetch(`/cache/${key}`, {
                method: "DELETE"
            });

            const data = await res.json();

            const container = document.getElementById("deleteResult");

            container.innerHTML = `
        <div><strong>Key:</strong> ${data.key}</div>
        <div>${renderStatus(data.status)}</div>
    `;

            log(`DELETE Result → ${data.status}`);
        }
        async function getCluster() {
            log("Fetching cluster info...");

            const res = await fetch(`/cache/cluster`);
            const data = await res.json();

            const container = document.getElementById("cluster");

            container.innerHTML = data.nodes.map(node => `
        <div class="p-2 bg-gray-800 rounded mb-2">
            🟢 ${node}
        </div>
    `).join("");

            log("Cluster loaded");
        }

    </script>

</body>

</html>
