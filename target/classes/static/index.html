<!DOCTYPE html>
<html>

<head>
    <title>Distributed Cache Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .badge-success {
            color: #22c55e;
        }

        .badge-error {
            color: #ef4444;
        }
    </style>
</head>

<body class="bg-black text-gray-200 p-6">

    <h1 class="text-4xl font-bold mb-8 text-blue-400">
        ⚡ Distributed Cache System
    </h1>

    <!-- GRID -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- PUT -->
        <div class="card">
            <h2 class="text-green-400 text-lg mb-4">PUT</h2>

            <input id="putKey" placeholder="Key" class="w-full p-2 mb-2 bg-gray-800 border border-gray-700 rounded">

            <input id="putValue" placeholder="Value" class="w-full p-2 mb-3 bg-gray-800 border border-gray-700 rounded">

            <button onclick="putData()" class="bg-green-500 w-full py-2 rounded hover:bg-green-600">
                Store
            </button>
        </div>

        <!-- GET -->
        <div class="card">
            <h2 class="text-blue-400 text-lg mb-4">GET</h2>

            <input id="getKey" placeholder="Key" class="w-full p-2 mb-3 bg-gray-800 border border-gray-700 rounded">

            <button onclick="getData()" class="bg-blue-500 w-full py-2 rounded hover:bg-blue-600">
                Fetch
            </button>

            <div id="getResult" class="mt-4 text-sm"></div>
        </div>

        <!-- DELETE -->
        <div class="card">
            <h2 class="text-red-400 text-lg mb-4">DELETE</h2>

            <input id="deleteKey" placeholder="Key" class="w-full p-2 mb-3 bg-gray-800 border border-gray-700 rounded">

            <button onclick="deleteData()" class="bg-red-500 w-full py-2 rounded hover:bg-red-600">
                Delete
            </button>

            <div id="deleteResult" class="mt-4 text-sm"></div>
        </div>

    </div>

    <!-- CLUSTER -->
    <div class="card mt-6">
        <h2 class="text-purple-400 mb-3">Cluster Nodes</h2>

        <button onclick="getCluster()" class="bg-purple-500 px-4 py-2 rounded hover:bg-purple-600">
            Load Cluster
        </button>

        <div id="cluster" class="mt-4 grid grid-cols-3 gap-3"></div>
    </div>

    <!-- LOGS -->
    <div class="card mt-6">
        <h2 class="text-yellow-400 mb-2">Live Logs</h2>
        <div id="logs" class="text-xs max-h-48 overflow-y-auto"></div>
    </div>

    <script>

        function log(msg) {
            const logs = document.getElementById("logs");
            logs.innerHTML = `<div>• ${msg}</div>` + logs.innerHTML;
        }

        function statusBadge(status) {
            return status.includes("SUCCESS")
                ? `<span class="badge-success">✔ ${status}</span>`
                : `<span class="badge-error">✖ ${status}</span>`;
        }

        async function putData() {
            const key = document.getElementById("putKey").value;
            const value = document.getElementById("putValue").value;

            const start = Date.now();

            const res = await fetch(`/cache?key=${key}&value=${value}`, {
                method: "POST"
            });

            const data = await res.json();
            const latency = Date.now() - start;

            log(`PUT ${key} → ${data.status} (${latency}ms)`);

            alert(JSON.stringify(data, null, 2));
        }

        async function getData() {
            const key = document.getElementById("getKey").value;

            const start = Date.now();

            const res = await fetch(`/cache/${key}`);
            const latency = Date.now() - start;

            const container = document.getElementById("getResult");

            if (res.status === 404) {
                container.innerHTML = `<div class="badge-error">Key not found</div>`;
                log(`GET ${key} → NOT FOUND`);
                return;
            }

            const data = await res.json();

            container.innerHTML = `
        <div><b>Value:</b> ${data.value}</div>
        <div>${statusBadge(data.status)}</div>
        <div class="text-gray-400 text-xs mt-1">Latency: ${latency} ms</div>
    `;

            log(`GET ${key} → ${data.value} (${latency}ms)`);
        }

        async function deleteData() {
            const key = document.getElementById("deleteKey").value;

            if (!confirm(`Delete key "${key}"?`)) return;

            const res = await fetch(`/cache/${key}`, {
                method: "DELETE"
            });

            const data = await res.json();

            document.getElementById("deleteResult").innerHTML =
                statusBadge(data.status);

            log(`DELETE ${key} → ${data.status}`);
        }

        async function getCluster() {
            const res = await fetch(`/cache/cluster`);
            const data = await res.json();

            document.getElementById("cluster").innerHTML =
                data.nodes.map(n => `
            <div class="p-2 bg-gray-800 rounded text-center">
                🟢 ${n}
            </div>
        `).join("");

            log("Cluster loaded");
        }

    </script>

</body>

</html>
